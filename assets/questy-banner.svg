<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B14" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="neonCyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.8" />
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#06B6D4" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="400" rx="16" fill="url(#grid)" />

  <!-- Ambient Glow Center -->
  <circle cx="600" cy="180" r="280" fill="url(#centerGlow)" />

  <!-- Tech Accent Lines -->
  <path d="M 100 80 L 1100 80" stroke="#334155" stroke-width="0.5" stroke-dasharray="8 8" opacity="0.4" />
  <path d="M 100 320 L 1100 320" stroke="#334155" stroke-width="0.5" stroke-dasharray="8 8" opacity="0.4" />

  <!-- Central Scientific Logo Icon -->
  <g transform="translate(600, 140)">
    <!-- Outer Orbital Ring -->
    <ellipse cx="0" cy="0" rx="72" ry="26" fill="none" stroke="url(#neonCyanPurple)" stroke-width="2.5" transform="rotate(-30)" opacity="0.85" filter="url(#softGlow)" />
    <!-- Cross Orbital Ring -->
    <ellipse cx="0" cy="0" rx="72" ry="26" fill="none" stroke="url(#neonCyanPurple)" stroke-width="2.5" transform="rotate(30)" opacity="0.85" filter="url(#softGlow)" />
    <!-- Equatorial Ring -->
    <ellipse cx="0" cy="0" rx="72" ry="22" fill="none" stroke="#38BDF8" stroke-width="1.8" opacity="0.7" />
    <!-- Core Nucleus / Diamond Pulse -->
    <circle cx="0" cy="0" r="14" fill="url(#neonCyanPurple)" filter="url(#softGlow)" />
    <circle cx="0" cy="0" r="6" fill="#FFFFFF" />

    <!-- Orbital Particles -->
    <circle cx="56" cy="-28" r="3.5" fill="#38BDF8" />
    <circle cx="-56" cy="28" r="3.5" fill="#C084FC" />
    <circle cx="-42" cy="-24" r="3" fill="#818CF8" />
  </g>

  <!-- Brand Typography -->
  <!-- Title -->
  <text x="600" y="270" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="12" fill="#FFFFFF">
    QUESTY
  </text>

  <!-- Glowing underline rule -->
  <rect x="460" y="286" width="280" height="3" rx="1.5" fill="url(#glowGrad)" filter="url(#softGlow)" />

  <!-- Subtitle Tagline -->
  <text x="600" y="325" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="4" fill="#94A3B8">
    AUTONOMOUS R&amp;D &amp; STRATEGIC INTELLIGENCE SUITE
  </text>

  <!-- Tech Metadata Markers -->
  <text x="60" y="50" font-family="monospace" font-size="11" fill="#64748B" opacity="0.8">SYSTEM: QUESTY_CORE // V2.4</text>
  <text x="1140" y="50" text-anchor="end" font-family="monospace" font-size="11" fill="#64748B" opacity="0.8">STATUS: PRODUCTION_GRADE</text>
  <circle cx="1152" cy="46" r="3.5" fill="#10B981" />
</svg>
