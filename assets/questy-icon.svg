<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="iconGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="iconFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="200" height="200" rx="44" fill="url(#iconBg)" stroke="#1E293B" stroke-width="2" />

  <g transform="translate(100, 100)">
    <!-- Orbit 1 -->
    <ellipse cx="0" cy="0" rx="64" ry="24" fill="none" stroke="url(#iconGlow)" stroke-width="3.5" transform="rotate(-30)" filter="url(#iconFilter)" />
    <!-- Orbit 2 -->
    <ellipse cx="0" cy="0" rx="64" ry="24" fill="none" stroke="url(#iconGlow)" stroke-width="3.5" transform="rotate(30)" filter="url(#iconFilter)" />
    <!-- Orbit 3 -->
    <ellipse cx="0" cy="0" rx="64" ry="20" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.75" />
    <!-- Core -->
    <circle cx="0" cy="0" r="14" fill="url(#iconGlow)" filter="url(#iconFilter)" />
    <circle cx="0" cy="0" r="6" fill="#FFFFFF" />
  </g>
</svg>
